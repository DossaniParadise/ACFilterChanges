<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AC Filter Changes - Operational Tracker</title>
  
  <!-- Modern Inter typeface for pristine typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Firebase Legacy Compat SDKs (perfect for standalone single-file apps) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    /* ==================================================================== */
    /* CUSTOM MODERN VANILLA STYLING (Light Theme, Pristine Polish)      */
    /* ==================================================================== */
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Primary Grays */
      --bg-app: #f8fafc;
      --bg-header: #ffffff;
      --color-border: #e2e8f0;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      
      /* Subtle Pastel Overdue Styles (Subtle Red Tint, Elegant Contrast) */
      --state-overdue-bg: #fef2f2;
      --state-overdue-border: #fca5a5;
      --state-overdue-text: #991b1b;
      --state-overdue-badge: #fee2e2;

      /* Subtle Pastel Clean Styles (Subtle Green Tint, Elegant Contrast) */
      --state-good-bg: #f0fdf4;
      --state-good-border: #bbf7d0;
      --state-good-text: #15803d;
      --state-good-badge: #dcfce7;

      /* Neutral Unrecorded Styles (Clean Soft Gray) */
      --state-none-bg: #ffffff;
      --state-none-border: #e2e8f0;
      --state-none-text: #475569;
      --state-none-badge: #f1f5f9;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-dark);
      background-color: var(--bg-app);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Styling */
    header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--color-border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Core Metrics Dashboard section */
    .metrics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      width: 100%;
      max-width: 500px;
    }

    .metric-card {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .metric-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      font-family: var(--font-mono);
    }

    /* Connected Badge */
    .connection-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background-color: #fee2e2;
      color: #991b1b;
      transition: var(--transition-fast);
    }

    .connection-badge.online {
      background-color: #dcfce7;
      color: #166534;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    /* Main Container Section */
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* Action bar with search & filter chips */
    .filter-actions-panel {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-wrapper {
      position: relative;
      flex: 1 1 300px;
      max-width: 450px;
    }

    .search-input {
      width: 100%;
      padding: 0.625rem 2.5rem 0.625rem 2.5rem;
      font-size: 0.875rem;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background-color: #ffffff;
      color: var(--text-dark);
      transition: var(--transition-fast);
      outline: none;
    }

    .search-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 1rem;
    }

    .search-clear-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      cursor: pointer;
      display: none;
      padding: 2px;
    }

    .filter-chips {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
    }

    .chip {
      background: #ffffff;
      border: 1px solid var(--color-border);
      color: var(--state-none-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.375rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition-fast);
      user-select: none;
    }

    .chip:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .chip.active {
      background: var(--text-dark);
      color: #ffffff;
      border-color: var(--text-dark);
    }

    /* Grid of Restaurants - Multi-column density */
    .restaurants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 0.5rem;
    }

    /* Card Layout styling (Extremely high-density horizontal row widget, optimized for mobile) */
    .store-card {
      background-color: var(--state-none-bg);
      border: 1px solid var(--state-none-border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.625rem;
      transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.1s ease;
      box-shadow: var(--shadow-sm);
      min-height: unset;
    }

    .store-card:hover {
      transform: translateX(2px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    /* Overdue Card Override */
    .store-card.state-overdue {
      background-color: var(--state-overdue-bg);
      border-color: var(--state-overdue-border);
    }
    .store-card.state-overdue .card-store-badge {
      background-color: var(--state-overdue-badge);
      color: var(--state-overdue-text);
    }

    /* Good Card Override */
    .store-card.state-good {
      background-color: var(--state-good-bg);
      border-color: var(--state-good-border);
    }
    .store-card.state-good .card-store-badge {
      background-color: var(--state-good-badge);
      color: var(--state-good-text);
    }

    .card-store-title {
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text-dark);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-store-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      background-color: var(--state-none-badge);
      color: var(--text-dark);
      white-space: nowrap;
    }

    .card-filter-size-label {
      font-size: 0.725rem;
      font-weight: 600;
      color: #1e40af;
      background-color: #eff6ff;
      padding: 0.05rem 0.3rem;
      border-radius: 4px;
      margin-top: 0.125rem;
      display: inline-flex;
      width: fit-content;
    }

    .card-filter-size-label.text-placeholder {
      color: #64748b;
      background-color: #f1f5f9;
      font-weight: 500;
    }

    .card-status-pill {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      letter-spacing: 0.025em;
    }

    .card-status-pill.state-overdue {
      background-color: var(--state-overdue-badge);
      color: var(--state-overdue-text);
    }

    .card-status-pill.state-good {
      background-color: var(--state-good-badge);
      color: var(--state-good-text);
    }

    .card-status-pill.state-none {
      background-color: var(--state-none-badge);
      color: var(--state-none-text);
    }

    .card-days-text {
      font-size: 0.725rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    /* Empty State fallback styling */
    .empty-state {
      grid-column: 1 / -1;
      background-color: #ffffff;
      border: 1px dashed var(--color-border);
      border-radius: 12px;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .empty-state-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.25rem;
    }

    .empty-state-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ==================================================================== */
    /* MODAL WINDOW DIALOGS STYLE                                           */
    /* ==================================================================== */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--color-border);
      overflow: hidden;
      animation: modalEntrance 0.15s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    @keyframes modalEntrance {
      from {
        transform: scale(0.95) translateY(10px);
        opacity: 0;
      }
      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f8fafc;
    }

    .modal-header h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
      transition: var(--transition-fast);
    }

    .modal-close-btn:hover {
      color: var(--text-dark);
    }

    .modal-body {
      padding: 1.25rem;
    }

    /* Info card section of the Modal (static store properties) */
    .store-details-plate {
      background-color: #f1f5f9;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .plate-row {
      display: flex;
      font-size: 0.8rem;
    }

    .plate-label {
      width: 90px;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .plate-value {
      font-weight: 500;
      color: var(--text-dark);
    }

    /* Modal Form elements */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .datepicker-wrapper {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .date-input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background-color: #ffffff;
      color: var(--text-dark);
      outline: none;
      transition: var(--transition-fast);
      font-family: var(--font-sans);
    }

    .date-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* Button Styling */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background-color: #ffffff;
      color: var(--text-dark);
      cursor: pointer;
      transition: var(--transition-fast);
      height: 38px;
      user-select: none;
    }

    .btn:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-today {
      background-color: #eff6ff;
      color: #1e40af;
      border-color: #bfdbfe;
    }

    .btn-today:hover {
      background-color: #dbeafe;
      border-color: #93c5fd;
    }

    .btn-clear {
      background-color: #fef2f2;
      color: #b91c1c;
      border-color: #fca5a5;
    }

    .btn-clear:hover {
      background-color: #fee2e2;
      border-color: #f87171;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
      border-color: #1d4ed8;
    }

    .modal-footer {
      padding: 0.875rem 1.25rem;
      border-top: 1px solid var(--color-border);
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      background-color: #f8fafc;
    }

    /* Response Breakpoint for Small Screens */
    @media (max-width: 640px) {
      main {
        margin: 1rem auto;
      }
      .header-container {
        flex-direction: column;
        align-items: flex-start;
      }
      .metrics-bar {
        max-width: 100%;
      }
      .filter-actions-panel {
        flex-direction: column;
        align-items: stretch;
      }
      .search-wrapper {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- ==================================================================== -->
  <!-- HEADER BAR & REALTIME STATS BANNER                                   -->
  <!-- ==================================================================== -->
  <header>
    <div class="header-container">
      <div>
        <h1 class="brand-title">
          <span>🔧</span> AC Filter Changes
        </h1>
        <div class="brand-subtitle">Store Maintenance Operations</div>
      </div>

      <!-- Compact operational stats dashboard -->
      <div class="metrics-bar">
        <div class="metric-card" style="border-left: 3px solid var(--state-overdue-border);">
          <span class="metric-label">Overdue</span>
          <span class="metric-value" id="statsOverdueCount">0</span>
        </div>
        <div class="metric-card" style="border-left: 3px solid var(--state-none-border);">
          <span class="metric-label">Pending</span>
          <span class="metric-value" id="statsPendingCount">0</span>
        </div>
        <div class="metric-card" style="border-left: 3px solid var(--state-good-border);">
          <span class="metric-label">Up to Date</span>
          <span class="metric-value" id="statsGoodCount">0</span>
        </div>
      </div>
      
      <!-- Connection Status Badge -->
      <div id="statusBadge" class="connection-badge">
        <div class="dot"></div>
        <span id="statusLabel">Offline</span>
      </div>
    </div>
  </header>

  <main>
    <!-- ==================================================================== -->
    <!-- SEARCH & FILTER CHIP PANEL                                           -->
    <!-- ==================================================================== -->
    <div class="filter-actions-panel">
      <!-- Search Input -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search by Store Number or Store Name..." 
          oninput="handleSearch(this.value)"
        />
        <button id="searchClearBtn" class="search-clear-btn" onclick="clearSearch()">✕</button>
      </div>

      <!-- Actionable Filtering state chips -->
      <div class="filter-chips">
        <button class="chip active" id="chip-all" onclick="setFilter('all')">All Stores (<span id="count-all">0</span>)</button>
        <button class="chip" id="chip-overdue" onclick="setFilter('overdue')" style="color: var(--state-overdue-text);">Overdue (<span id="count-overdue">0</span>)</button>
        <button class="chip" id="chip-none" onclick="setFilter('none')" style="color: var(--state-none-text);">Pending (<span id="count-none">0</span>)</button>
        <button class="chip" id="chip-good" onclick="setFilter('good')" style="color: var(--state-good-text);">Up to Date (<span id="count-good">0</span>)</button>
      </div>
    </div>

    <!-- ==================================================================== -->
    <!-- COMPACT STORES LIST GRID                                             -->
    <!-- ==================================================================== -->
    <div class="restaurants-grid" id="storesGrid">
      <!-- Generated Dynamically via javascript rendering -->
      <div class="empty-state">
        <div class="empty-state-title">Loading Restaurant List...</div>
        <div class="empty-state-desc">Synchronizing with live Firebase operational systems.</div>
      </div>
    </div>
  </main>

  <!-- ==================================================================== -->
  <!-- STORE DETAILS & HISTORIC CHANGE FORM DIALOG                           -->
  <!-- ==================================================================== -->
  <div class="modal-backdrop" id="detailsModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalStoreTitle">Store Details</h3>
        <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      </div>
      
      <div class="modal-body">
        <!-- Live Restaurant Address & Contact Detail plates -->
        <div class="store-details-plate">
          <div class="plate-row">
            <span class="plate-label">Store ID:</span>
            <span class="plate-value" id="modalStoreNumber">---</span>
          </div>
          <div class="plate-row">
            <span class="plate-label">Address:</span>
            <span class="plate-value" id="modalStoreAddress">---</span>
          </div>
          <div class="plate-row">
            <span class="plate-label">Phone:</span>
            <span class="plate-value" id="modalStorePhone">---</span>
          </div>
        </div>

        <!-- Filter change record form -->
        <div class="form-group">
          <label class="form-label">When was filter changed?</label>
          <div class="datepicker-wrapper">
            <input type="date" id="modalDatePicker" class="date-input">
            <button class="btn btn-today" onclick="setDatePickerToToday()">Today</button>
          </div>
        </div>

        <!-- Coils Cleaned Question -->
        <div class="form-group" style="margin-top: 1rem;">
          <label class="form-label">Were the coils cleaned?</label>
          <div style="display: flex; gap: 0.5rem;">
            <button type="button" id="btnCoilsYes" class="btn" style="flex: 1;" onclick="setCoilsCleaned('yes')">Yes</button>
            <button type="button" id="btnCoilsNo" class="btn" style="flex: 1;" onclick="setCoilsCleaned('no')">No</button>
          </div>
          <input type="hidden" id="modalCoilsCleaned" value="">
        </div>

        <!-- Filter Size Field -->
        <div class="form-group" style="margin-top: 1rem;">
          <label class="form-label">Filter Size(s)</label>
          <input type="text" id="modalFilterSize" class="date-input" style="width: 100%;" placeholder="e.g. (2) 20x20x2, (4) 20x25x2">
        </div>

        <!-- Comments Field -->
        <div class="form-group" style="margin-top: 1rem;">
          <div class="form-label" style="display: flex; justify-content: space-between; align-items: center;">
            <span>Additional Comments</span>
            <span id="charCount" style="font-size: 0.725rem; font-weight: normal; color: var(--text-muted);">0 / 250</span>
          </div>
          <textarea id="modalComments" class="date-input" style="width: 100%; height: 75px; resize: none; font-family: var(--font-sans); line-height: 1.4; padding: 0.5rem;" maxlength="250" oninput="updateCommentCharLimit(this.value)" placeholder="Enter any extra details or technician notes..."></textarea>
        </div>
      </div>
      
      <div class="modal-footer">
        <button class="btn btn-clear" style="margin-right: auto;" onclick="clearFilterChangeDate()">Clear Date</button>
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveFilterChangeDate()">Save</button>
      </div>
    </div>
  </div>


  <!-- ==================================================================== -->
  <!-- MAIN JAVASCRIPT APP ARCHITECTURE INTERNALS                           -->
  <!-- ==================================================================== -->
  <script>
    // ==========================================
    // 1. CONFIG
    // ==========================================
    // Single point of configuration as requested:
    const REMINDER_THRESHOLD_DAYS = 60; 

    // Firebase live config setup
    const firebaseConfig = {
      apiKey: "AIzaSyDIGLmJ5r_fBhB5xOL8oadQ7csN3wGh2dI",
      authDomain: "dpm-alignment.firebaseapp.com",
      databaseURL: "https://dpm-alignment-default-rtdb.firebaseio.com",
      projectId: "dpm-alignment",
      storageBucket: "dpm-alignment.firebasestorage.app",
      messagingSenderId: "298588092433",
      appId: "1:298588092433:web:694a9412658adac039d9b0"
    };

    // ==========================================
    // 2. FIREBASE INITIALIZATION
    // ==========================================
    // Initialize the background system connections
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // 3. DATA ACCESS LAYER
    // ==========================================
    // In-memory runtime data cache stores
    let restaurants = {};
    let filterChanges = {};
    
    // UI reactive settings
    let searchQuery = "";
    let activeFilter = "all"; // 'all', 'overdue', 'none', 'good'
    let selectedStoreId = null;

    // Helper to sanitize key paths for Firebase Compatibility 
    // This replaces forbidden characters like '.', '#', '$', '[', ']'
    // while keeping clean strings such as "1023" or "BK_27082"
    function getFirebaseSafePathKey(storeNumber) {
      if (!storeNumber) return "unknown";
      return String(storeNumber)
        .replace(/[.#$[\]/]/g, "")
        .replace(/\s+/g, "_")
        .trim();
    }

    // Subscribe to Read-Only centralized Restaurant directory (Owned by organization app)
    db.ref("restaurants").on("value", (snapshot) => {
      restaurants = snapshot.val() || {};
      combineAndRender();
    });

    // Subscribe to our dedicated Filter Changes table (Owned by this app)
    db.ref("filterChanges").on("value", (snapshot) => {
      filterChanges = snapshot.val() || {};
      combineAndRender();
    });

    // Handle Network Connection State monitoring
    db.ref(".info/connected").on("value", (snap) => {
      const badge = document.getElementById("statusBadge");
      const label = document.getElementById("statusLabel");
      if (snap.val() === true) {
        badge.className = "connection-badge online";
        label.innerText = "Syncing Realtime";
      } else {
        badge.className = "connection-badge";
        label.innerText = "Offline";
      }
    });

    // ==========================================
    // 4. STATUS CALCULATIONS
    // ==========================================
    // Standard timestamp calculations
    function calculateDaysSinceChange(lastChangedTimestamp) {
      if (!lastChangedTimestamp) return null;
      const differenceMs = Date.now() - lastChangedTimestamp;
      const computedDays = Math.floor(differenceMs / (1000 * 60 * 60 * 24));
      return Math.max(0, computedDays);
    }

    // Classify store operational status based on time metrics
    function getStoreStatusClass(daysElapsed) {
      if (daysElapsed === null) return "state-none";
      return daysElapsed > REMINDER_THRESHOLD_DAYS ? "state-overdue" : "state-good";
    }

    // Format millisecond epoch into clean date string in America/Chicago context
    function formatTimeInChicagoTimezone(timestamp) {
      if (!timestamp) return "No Filter Change Recorded";
      const utcDate = new Date(timestamp);
      return utcDate.toLocaleDateString("en-US", {
        timeZone: "America/Chicago",
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    // Produce YYYY-MM-DD input default values customized for Chicago Offset
    function getChicagoTodayDateString(timestamp) {
      const dateContext = timestamp ? new Date(timestamp) : new Date();
      const options = {
        timeZone: 'America/Chicago',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      };
      
      const formatter = new Intl.DateTimeFormat('en-US', options);
      const parts = formatter.formatToParts(dateContext);
      const partMap = {};
      parts.forEach(p => partMap[p.type] = p.value);
      return `${partMap.year}-${partMap.month}-${partMap.day}`;
    }

    // Convert raw YYYY-MM-DD input value back to midday US Central Epoch for clean sorting entries
    function convertDateStringToChicagoTimestamp(dateStr) {
      if (!dateStr) return null;
      const [year, month, day] = dateStr.split('-').map(Number);
      
      // We set the time to 12:00:00 (midday) local parameters to avoid timezone crossover conversions.
      return new Date(year, month - 1, day, 12, 0, 0).getTime();
    }

    // ==========================================
    // 5. RENDERING PIPELINE
    // ==========================================
    function combineAndRender() {
      const storesGrid = document.getElementById("storesGrid");
      const restaurantList = Object.values(restaurants);

      if (restaurantList.length === 0) {
        storesGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">No Restaurants Found</div>
            <div class="empty-state-desc">Make sure restaurants are configured in the organization tracker database.</div>
          </div>
        `;
        updateStatsMetrics([], {});
        return;
      }

      // Map operational structure metrics with joined filter changes
      const enrichedStores = restaurantList.map(store => {
        const safeKey = getFirebaseSafePathKey(store.storeNumber);
        const trackingRecord = filterChanges[safeKey] || {};
        const timestamp = trackingRecord.lastFilterChangeTimestamp || null;
        const daysElapsed = calculateDaysSinceChange(timestamp);
        
        return {
          ...store,
          lastFilterChangeTimestamp: timestamp,
          daysElapsed: daysElapsed,
          status: getStoreStatusClass(daysElapsed),
          filterSize: trackingRecord.filterSize || ""
        };
      });

      // Update counters regardless of search & filters
      updateStatsMetrics(enrichedStores);

      // Apply Search Filter (Case-insensitive matching store number, name, or filter size)
      let displayedStores = enrichedStores;
      const query = searchQuery.trim().toLowerCase();
      if (query) {
        displayedStores = enrichedStores.filter(store => {
          const storeName = (store.storeName || "").toLowerCase();
          const storeNumber = (store.storeNumber || "").toLowerCase();
          const filterSize = (store.filterSize || "").toLowerCase();
          return storeName.includes(query) || storeNumber.includes(query) || filterSize.includes(query);
        });
      }

      // Apply Category Filters
      if (activeFilter !== "all") {
        displayedStores = displayedStores.filter(store => {
          if (activeFilter === "overdue") return store.status === "state-overdue";
          if (activeFilter === "none") return store.status === "state-none";
          if (activeFilter === "good") return store.status === "state-good";
          return true;
        });
      }

      // Sort Order Strategy: Most overdue stores first
      displayedStores.sort((a, b) => {
        const aPriority = a.status === "state-overdue" ? 1 : (a.status === "state-none" ? 2 : 3);
        const bPriority = b.status === "state-overdue" ? 1 : (b.status === "state-none" ? 2 : 3);
        
        if (aPriority !== bPriority) {
          return aPriority - bPriority;
        }

        if (a.status === "state-overdue") {
          return b.daysElapsed - a.daysElapsed;
        }
        
        if (a.status === "state-good") {
          return b.daysElapsed - a.daysElapsed;
        }

        const numA = (a.storeNumber || "").toLowerCase();
        const numB = (b.storeNumber || "").toLowerCase();
        return numA.localeCompare(numB, undefined, { numeric: true });
      });

      // Render the built HTML
      if (displayedStores.length === 0) {
        storesGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">No Stores Match Applied Criteria</div>
            <div class="empty-state-desc">Try refining your search query or selecting a different status filter chip.</div>
          </div>
        `;
        return;
      }

      let gridHtml = "";
      displayedStores.forEach(store => {
        let statusString = "";
        let daysString = "";
        let iconHtml = "⚪";

        if (store.status === "state-overdue") {
          statusString = "OVERDUE";
          daysString = `${store.daysElapsed}d overdue`;
          iconHtml = "⚠️";
        } else if (store.status === "state-good") {
          statusString = "GOOD";
          daysString = `${store.daysElapsed}d ago`;
          iconHtml = "✅";
        } else {
          statusString = "PENDING";
          daysString = "Never";
          iconHtml = "➖";
        }

        gridHtml += `
          <div class="store-card ${store.status}" onclick="openStoreDetails('${store.id}')">
            <!-- Left Panel: Icon status indicator & Store Number -->
            <div style="display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0;">
              <span style="font-size: 1rem; line-height: 1;">${iconHtml}</span>
              <span class="card-store-badge">${escapeHtml(store.storeNumber || '#')}</span>
            </div>

            <!-- Center Panel: High-density info with short details -->
            <div style="display: flex; flex-direction: column; min-width: 0; flex: 1; margin: 0 0.15rem;">
              <span class="card-store-title" title="${escapeHtml(store.storeName)}">${escapeHtml(store.storeName)}</span>
              ${store.filterSize ? `
                <span class="card-filter-size-label" style="display: inline-flex; align-items: center; gap: 0.25rem;">
                  <strong>📏 ${escapeHtml(store.filterSize)}</strong>
                </span>
              ` : `
                <span class="card-filter-size-label text-placeholder" style="display: inline-flex; align-items: center; gap: 0.25rem;">
                  <span>📏</span> Set size
                </span>
              `}
            </div>

            <!-- Right Panel: Relative time metrics -->
            <div style="text-align: right; display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; min-width: 72px;">
              <span class="card-status-pill ${store.status}">${statusString}</span>
              <span class="card-days-text">${daysString}</span>
            </div>
          </div>
        `;
      });

      storesGrid.innerHTML = gridHtml;
    }

    // Calculate aggregated counter states
    function updateStatsMetrics(allStores) {
      const totalCount = allStores.length;
      const overdueCount = allStores.filter(s => s.status === "state-overdue").length;
      const pendingCount = allStores.filter(s => s.status === "state-none").length;
      const goodCount = allStores.filter(s => s.status === "state-good").length;

      // Stats visual boxes
      document.getElementById("statsOverdueCount").innerText = overdueCount;
      document.getElementById("statsPendingCount").innerText = pendingCount;
      document.getElementById("statsGoodCount").innerText = goodCount;

      // Filter chips counts
      document.getElementById("count-all").innerText = totalCount;
      document.getElementById("count-overdue").innerText = overdueCount;
      document.getElementById("count-none").innerText = pendingCount;
      document.getElementById("count-good").innerText = goodCount;
    }

    // ==========================================
    // 6. MODAL INTERACTIVE DIALOG LAYER
    // ==========================================
    function openStoreDetails(storeId) {
      selectedStoreId = storeId;
      const storeObj = restaurants[storeId];
      if (!storeObj) return;

      const safeKey = getFirebaseSafePathKey(storeObj.storeNumber);
      const trackingRecord = filterChanges[safeKey] || {};
      const lastChangeTimestamp = trackingRecord.lastFilterChangeTimestamp || null;

      // Title & static metadata
      document.getElementById("modalStoreTitle").innerText = storeObj.storeName;
      document.getElementById("modalStoreNumber").innerText = storeObj.storeNumber || "N/A";
      document.getElementById("modalStoreAddress").innerText = storeObj.address || "No address populated";
      document.getElementById("modalStorePhone").innerText = storeObj.phone || "No phone listed";

      // Set date picker value to already entered date, or empty
      const picker = document.getElementById("modalDatePicker");
      if (lastChangeTimestamp) {
        picker.value = getChicagoTodayDateString(lastChangeTimestamp);
      } else {
        picker.value = "";
      }

      // Set the coils question state
      const coilsVal = trackingRecord.coilsCleaned || "";
      setCoilsCleaned(coilsVal);

      // Set filter sizes value
      const filterSizeInput = document.getElementById("modalFilterSize");
      if (filterSizeInput) {
        filterSizeInput.value = trackingRecord.filterSize || "";
      }

      // Set comments input state
      const commentsTextarea = document.getElementById("modalComments");
      if (commentsTextarea) {
        commentsTextarea.value = trackingRecord.comments || "";
        updateCommentCharLimit(commentsTextarea.value);
      }

      document.getElementById("detailsModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("detailsModal").classList.remove("active");
      selectedStoreId = null;
    }

    function setDatePickerToToday() {
      // Populates the date picker with today's formatted USA Central Date
      const todayDateStr = getChicagoTodayDateString();
      document.getElementById("modalDatePicker").value = todayDateStr;
    }

    // Coils Yes / No button handler helper
    function setCoilsCleaned(val) {
      const input = document.getElementById("modalCoilsCleaned");
      const btnYes = document.getElementById("btnCoilsYes");
      const btnNo = document.getElementById("btnCoilsNo");
      
      if (!input || !btnYes || !btnNo) return;
      
      input.value = val;
      
      if (val === "yes") {
        btnYes.className = "btn btn-primary";
        btnYes.style.backgroundColor = "#16a34a"; // Green active
        btnYes.style.borderColor = "#16a34a";
        btnYes.style.color = "#ffffff";

        btnNo.className = "btn";
        btnNo.style.backgroundColor = "";
        btnNo.style.borderColor = "";
        btnNo.style.color = "";
      } else if (val === "no") {
        btnNo.className = "btn btn-primary";
        btnNo.style.backgroundColor = "#dc2626"; // Red active
        btnNo.style.borderColor = "#dc2626";
        btnNo.style.color = "#ffffff";

        btnYes.className = "btn";
        btnYes.style.backgroundColor = "";
        btnYes.style.borderColor = "";
        btnYes.style.color = "";
      } else {
        // Reset both
        btnYes.className = "btn";
        btnYes.style.backgroundColor = "";
        btnYes.style.borderColor = "";
        btnYes.style.color = "";

        btnNo.className = "btn";
        btnNo.style.backgroundColor = "";
        btnNo.style.borderColor = "";
        btnNo.style.color = "";
      }
    }

    // Comments character limit helper
    function updateCommentCharLimit(value) {
      const charCountEl = document.getElementById("charCount");
      if (charCountEl) {
        charCountEl.innerText = `${value.length} / 250`;
      }
    }

    // Write date entry straight to Firebase
    function saveFilterChangeDate() {
      if (!selectedStoreId) return;
      const storeObj = restaurants[selectedStoreId];
      if (!storeObj) return;

      const safeKey = getFirebaseSafePathKey(storeObj.storeNumber);
      const pickerValue = document.getElementById("modalDatePicker").value;

      if (!pickerValue) {
        alert("Please choose a valid calendar date or select 'Today'.");
        return;
      }

      const timestamp = convertDateStringToChicagoTimestamp(pickerValue);
      const coilsCleanedValue = document.getElementById("modalCoilsCleaned").value;
      const filterSizeValue = document.getElementById("modalFilterSize").value.trim();
      const commentsValue = document.getElementById("modalComments").value.trim();

      // Writes straight into /filterChanges/<storeNumber>
      db.ref(`filterChanges/${safeKey}`).set({
        storeNumber: storeObj.storeNumber,
        lastFilterChangeTimestamp: timestamp,
        coilsCleaned: coilsCleanedValue,
        filterSize: filterSizeValue,
        comments: commentsValue
      }, (err) => {
        if (err) {
          alert("Could not persist record: " + err.message);
        } else {
          closeModal();
        }
      });
    }

    // Erase change record tracking
    function clearFilterChangeDate() {
      if (!selectedStoreId) return;
      const storeObj = restaurants[selectedStoreId];
      if (!storeObj) return;

      if (confirm(`Do you want to reset and clear the recorded filter change metadata for ${storeObj.storeName}?`)) {
        const safeKey = getFirebaseSafePathKey(storeObj.storeNumber);
        
        db.ref(`filterChanges/${safeKey}`).remove((err) => {
          if (err) {
            alert("Clear command failed: " + err.message);
          } else {
            closeModal();
          }
        });
      }
    }

    // ==========================================
    // 7. EVENT HANDLERS
    // ==========================================
    function handleSearch(val) {
      searchQuery = val;
      const clearBtn = document.getElementById("searchClearBtn");
      if (clearBtn) {
        clearBtn.style.display = val.trim() ? "block" : "none";
      }
      combineAndRender();
    }

    function clearSearch() {
      const input = document.getElementById("searchInput");
      if (input) input.value = "";
      searchQuery = "";
      document.getElementById("searchClearBtn").style.display = "none";
      combineAndRender();
    }

    function setFilter(filterType) {
      activeFilter = filterType;
      
      // Update chip CSS classes
      const chips = ["all", "overdue", "none", "good"];
      chips.forEach(c => {
        const el = document.getElementById(`chip-${c}`);
        if (el) {
          if (c === filterType) {
            el.classList.add("active");
          } else {
            el.classList.remove("active");
          }
        }
      });

      combineAndRender();
    }

    // Escape dynamic inputs safely
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ==========================================
    // 8. INITIALIZATION
    // ==========================================
    // Close modal if user clicks on background overlay
    document.getElementById("detailsModal").addEventListener("click", function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
  </script>
</body>
</html>
